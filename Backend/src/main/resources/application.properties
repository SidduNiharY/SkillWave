# =====================================================
# Server
# =====================================================
server.port=8080

# =====================================================
# Application - JWT (HS256)
# =====================================================
app.jwt.issuer=skillwave
app.jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_64_CHARS_1234567890
app.jwt.accessTokenMinutes=30

# Frontend redirect after Google OAuth success
app.frontend.successRedirect=http://localhost:5173/auth/callback

# =====================================================
# PostgreSQL
# =====================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/skillwave
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================
# JPA / Hibernate
# =====================================================
# IMPORTANT: If you use Flyway, keep this as validate (NOT update)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =====================================================
# Flyway (MUST run before Hibernate)
# =====================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
logging.level.org.flywaydb=DEBUG

# =====================================================
# Redis
# =====================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# If Redis is down, we still want app to run (cache uses in-memory)
spring.cache.type=simple

# =====================================================
# Kafka
# =====================================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=skillwave-backend
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

app.kafka.enabled=true

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# =====================================================
# OAuth2 - Google Login (FIXED: no issuer-uri discovery)
# =====================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# \u2705 Manual provider endpoints (prevents startup call to Google issuer discovery)
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

# =====================================================
# Logging
# =====================================================
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.com.skillwave=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot.web.servlet.error=DEBUG

# Show the real error in response (TEMP for debugging)
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

# =====================================================
# Actuator
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =========================
# OTP / Signup
# =========================
app.otp.ttlSeconds=300
app.otp.length=6

# =========================
# Mail (Gmail SMTP example)
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =====================================================
# JWT Keypair (ONLY if you are using RS256)
# =====================================================
# NOTE:
# If you're using HS256 (app.jwt.secret), you can REMOVE these.
# If you're using RS256 in JwtEncoder/JwtDecoder, keep these.
jwt.public-key=classpath:keys/public.pem
jwt.private-key=classpath:keys/private.pem



tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += "-parameters"
}