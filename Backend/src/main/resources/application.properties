# =====================================================
# Server
# =====================================================
server.port=8080

# =====================================================
# Application - JWT
# =====================================================
# IMPORTANT:
# Use a LONG (64+ chars) random secret for HS256
app.jwt.issuer=skillwave
app.jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_64_CHARS_1234567890
app.jwt.accessTokenMinutes=30



# Frontend redirect after Google OAuth success
app.frontend.successRedirect=http://localhost:5173/auth/callback

# =====================================================
# PostgreSQL
# =====================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/skillwave
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================
# JPA / Hibernate
# =====================================================
# Validate schema created by Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =====================================================
# Flyway (MUST run before Hibernate)
# =====================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# =====================================================
# Redis
# =====================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# =====================================================
# Kafka
# =====================================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=skillwave-backend
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

app.kafka.enabled=true

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# =====================================================
# OAuth2 - Google Login
# =====================================================
# Prefer environment variables in real setups
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

# =====================================================
# Logging - Console Format
# =====================================================
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Application logs
logging.level.com.skillwave=INFO

# Spring Security logs (use DEBUG only if troubleshooting)
logging.level.org.springframework.security=INFO

# Flyway logs (VERY important for schema issues)
logging.level.org.flywaydb=INFO

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
logging.level.org.flywaydb=DEBUG

# Hibernate SQL (optional \u2013 noisy)
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =====================================================
# Actuator
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


spring.jpa.hibernate.ddl-auto=update


# =========================
# OTP / Signup
# =========================
app.otp.ttlSeconds=300
app.otp.length=6

# =========================
# Mail (Gmail SMTP example)
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


logging.level.org.springframework.security=DEBUG

# Show the real error in response (TEMP for debugging)
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

# Make Spring print exceptions
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot.web.servlet.error=DEBUG
logging.level.org.springframework.security=DEBUG





spring.cache.type=simple





jwt.public-key=classpath:keys/public.pem
jwt.private-key=classpath:keys/private.pem










